<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elisa</title>
<style>
:root{--bg:#100d0c;--ink:#eee6d8;--muted:#8d9686}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden!important;background:#100d0c!important;color:var(--ink);font-family:Georgia,"Times New Roman",serif}#stage{position:fixed;inset:0;width:100%;height:100%;display:block}.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");animation:grain 1s steps(5) infinite}@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(2%,-2%)}100%{transform:translate(0,0)}}.brand{position:fixed;top:22px;left:28px;font-size:12px;letter-spacing:.35em;color:#a9c0a0}.brand b{display:block;color:#eee6d8;font-size:25px;letter-spacing:0;font-weight:400;margin-top:2px}.caption{position:fixed;left:4vw;bottom:7vh;font:500 15px Arial,sans-serif;color:#e9dfcc}.tag{position:fixed;right:4vw;bottom:7vh;font:15px Arial,sans-serif;color:#9da78d}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#100d0c;transition:opacity .8s}.loader.done{opacity:0;pointer-events:none}.ring{width:92px;height:92px;border:1px solid #596c55;border-top-color:#d2c7ac;border-radius:50%;display:grid;place-items:center;color:#e9dfcc;font:14px Arial}
</style></head><body>
<canvas id="stage"></canvas><div class="grain"></div><div class="brand">E · L · I · S · A<b>Elisa.</b></div><div class="caption">Grows quiet things with AI</div><div class="tag">A botanist made of light</div><div class="loader" id="loader"><div class="ring" id="count">0%</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0x100d0c,1);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,0,8);camera.lookAt(0,0,0);
const U={uTime:{value:0},uYaw:{value:0},uCursor:{value:new THREE.Vector2()},uCursorPower:{value:0},uPixel:{value:800}};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();U.uPixel.value=renderer.getPixelRatio()*innerHeight/(2*Math.tan(THREE.MathUtils.degToRad(19)));}addEventListener('resize',resize);resize();
const pointer={x:0,y:0,active:false};addEventListener('pointermove',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=1-e.clientY/innerHeight*2;pointer.active=true});addEventListener('pointerleave',()=>pointer.active=false);
const vertex=`uniform float uTime,uYaw,uPixel,uCursorPower;uniform vec2 uCursor;attribute vec3 aColor;attribute float aHead,aSeed;varying vec3 vColor;varying float vAlpha,vGlow;void main(){vec3 p=position;float yaw=uYaw*aHead;float pivotY=-.194;float py=p.y-pivotY;float c=cos(yaw),s=sin(yaw);float x=p.x*c+p.z*s;float z=-p.x*s+p.z*c;p.x=x;p.y=py*c-p.z*s+pivotY;p.z=py*s+p.z*c;vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float d=distance(p.xy,uCursor);vGlow=exp(-d*d*3.8)*uCursorPower;vColor=aColor;vAlpha=.72+.22*sin(uTime*1.1+aSeed*19.);gl_PointSize=(1.25+aSeed*1.15+vGlow*1.1)*uPixel/-mv.z;}`;
const fragment=`varying vec3 vColor;varying float vAlpha,vGlow;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float soft=1.-smoothstep(.22,.5,d);vec3 col=vColor*(.94+vGlow*.42);gl_FragColor=vec4(col,soft*vAlpha);}`;
function loadParticles(){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{const w=img.naturalWidth,h=img.naturalHeight,off=document.createElement('canvas');off.width=w;off.height=h;const cx=off.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);const pix=cx.getImageData(0,0,w,h).data;const positions=[],colors=[],heads=[],seeds=[];const step=2;const worldH=5.55,worldW=worldH*w/h;let count=0;
for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){const i=(y*w+x)*4,r=pix[i],g=pix[i+1],b=pix[i+2];const lum=.2126*r+.7152*g+.0722*b;const nx=x/w,ny=y/h;
// Suppress the near-black room while retaining dark hair and clothing inside the subject silhouette.
let inSubject=false;if(ny<.58){const cxn=.5,rx=ny<.12?.43:.48;inSubject=Math.abs(nx-cxn)<rx;}else{const bodyWidth=.5+Math.min(.12,(ny-.58)*.32);inSubject=Math.abs(nx-.5)<bodyWidth;}
if(!inSubject||lum<9)continue;
// Slightly lift shadows without washing out the natural skin, hair, or dark clothing colors.
const lift=v=>Math.min(1,Math.pow(v/255,.82)*.93+.012);const cr=lift(r),cg=lift(g),cb=lift(b);
const jitter=(Math.random()-.5)*.008;const px=(nx-.5)*worldW+jitter,py=(.5-ny)*worldH+jitter;
positions.push(px,py,(Math.random()-.5)*.035);colors.push(cr,cg,cb);
// Head region only: head pivots at the base of the neck. Chest/shoulders remain locked.
heads.push(ny<.535?1:0);seeds.push(Math.random());count++;
}}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('aColor',new THREE.Float32BufferAttribute(colors,3));geo.setAttribute('aHead',new THREE.Float32BufferAttribute(heads,1));geo.setAttribute('aSeed',new THREE.Float32BufferAttribute(seeds,1));
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:vertex,fragmentShader:fragment,transparent:true,depthWrite:false,blending:THREE.NormalBlending});const points=new THREE.Points(geo,mat);points.frustumCulled=false;scene.add(points);
// Fine ambient dust in front of the portrait.
const n=420,dp=new Float32Array(n*3);for(let i=0;i<n;i++)dp.set([(Math.random()-.5)*5,(Math.random()-.5)*6,(Math.random()-.5)*.5+.3],i*3);const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));const dm=new THREE.PointsMaterial({color:0xb8aa8e,size:.012,transparent:true,opacity:.32,depthWrite:false});const dust=new THREE.Points(dg,dm);scene.add(dust);
resolve({count,dust});}catch(e){reject(e)}};img.onerror=()=>reject(new Error('Could not load Elisa reference image'));img.src='elisa-reference.jpg';});}
let smoothX=0,smoothY=0;function animate(t){const s=t*.001;U.uTime.value=s;smoothX+=(pointer.x-smoothX)*.025;smoothY+=(pointer.y-smoothY)*.025;U.uYaw.value=(pointer.active?smoothX*.19:Math.sin(s*.35)*.012);U.uCursor.value.set(smoothX*1.1,smoothY*1.2);U.uCursorPower.value+=((pointer.active?1:0)-U.uCursorPower.value)*.04;renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
loadParticles().then(({count})=>{const el=document.querySelector('#count');el.textContent='100%';setTimeout(()=>document.querySelector('#loader').classList.add('done'),250);console.info('Elisa particle portrait:',count,'particles');}).catch(err=>{document.querySelector('#count').textContent='Portrait error';console.error(err)});
})();
</script></body></html>
