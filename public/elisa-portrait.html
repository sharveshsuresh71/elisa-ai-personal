<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d100d">
<title>Elisa</title>
<style>
:root{--bg:#0d100d;--ink:#e9e6da;--muted:#a0a795;--sage:#b7c9a9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-2%,3%)}80%{transform:translate(4%,1%)}100%{transform:translate(0,0)}}
.hero{position:fixed;left:6vw;bottom:8vh;opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none;text-shadow:0 2px 24px #0008}.hero.on{opacity:1;transform:none}h1{font-weight:400;font-size:clamp(34px,5vw,64px);margin:0;letter-spacing:-.04em}.sub{margin:.55em 0 0;color:var(--muted);font-size:clamp(13px,1.2vw,16px);letter-spacing:.03em}
.loader{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at center,#20271e 0%,#0d100d 62%);transition:opacity .8s ease;z-index:3}.loader.done{opacity:0;pointer-events:none}.ringbox{position:relative;width:112px;height:112px}.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}.ringbox circle{fill:none;stroke-width:2}.ringbox .track{stroke:#e9e6da20}.ringbox .fill{stroke:var(--sage);stroke-linecap:round;transition:stroke-dashoffset .15s linear}.count{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;letter-spacing:.08em;font-variant-numeric:tabular-nums}.loadlabel{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.error{max-width:min(80vw,560px);font-size:13px;line-height:1.6;color:#e8b7a8;text-align:center;display:none}.error.show{display:block}.hint{position:fixed;right:6vw;bottom:8vh;color:#a0a795;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity 1s}.hint.on{opacity:.8}
@media(max-width:700px){.hero{left:7vw;bottom:7vh}.hint{right:7vw;bottom:7vh;font-size:9px}}
</style>
</head>
<body>
<canvas id="stage"></canvas><div class="grain"></div>
<div class="loader" id="loader"><div class="ringbox"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="53"/><circle class="fill" id="ring" cx="60" cy="60" r="53" stroke-dasharray="333" stroke-dashoffset="333"/></svg><div class="count" id="count">0%</div></div><div class="loadlabel" id="loadlabel">Loading Elisa's character</div><div class="error" id="error"></div></div>
<div class="hero" id="hero"><h1>Elisa</h1><p class="sub">Grows quiet things with AI</p></div><div class="hint" id="hint">Move your cursor to explore</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.6.9/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('stage'),loaderEl=document.getElementById('loader'),countEl=document.getElementById('count'),ringEl=document.getElementById('ring'),labelEl=document.getElementById('loadlabel'),errorEl=document.getElementById('error');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d100d);
const camera=new THREE.PerspectiveCamera(32,1,0.01,1000);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
scene.add(new THREE.HemisphereLight(0xdde8d6,0x24251f,2.0));
const key=new THREE.DirectionalLight(0xffe8ce,2.6);key.position.set(4,6,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9db7a5,1.5);fill.position.set(-5,2,3);scene.add(fill);
const rim=new THREE.DirectionalLight(0xc8d4b8,2.0);rim.position.set(0,4,-5);scene.add(rim);
const cursorLight=new THREE.PointLight(0xb9d7b0,0,8);scene.add(cursorLight);
const modelRoot=new THREE.Group();scene.add(modelRoot);
let model=null, targetYaw=0,targetPitch=0,currentYaw=0,currentPitch=0;
const pointer={x:0,y:0,active:false};
window.addEventListener('pointermove',e=>{pointer.x=(e.clientX/innerWidth-.5)*2;pointer.y=(e.clientY/innerHeight-.5)*2;pointer.active=true;});
window.addEventListener('pointerleave',()=>pointer.active=false);
function progress(p){const v=Math.max(0,Math.min(1,p));countEl.textContent=Math.round(v*100)+'%';ringEl.style.strokeDashoffset=333*(1-v);}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
function showError(err){console.error('Elisa FBX load failed:',err);labelEl.textContent='Could not load the character';errorEl.textContent='The 3D model did not load. Check that /elisa-character.fbx exists in the deployed public folder and that the browser can reach the Three.js and fflate scripts.';errorEl.classList.add('show');countEl.textContent='!';}
function finish(){loaderEl.classList.add('done');document.getElementById('hero').classList.add('on');document.getElementById('hint').classList.add('on');}
if(!window.THREE||!THREE.FBXLoader){showError(new Error('Three.js FBXLoader script unavailable'));return;}
const fbxLoader=new THREE.FBXLoader();
fbxLoader.load('/elisa-character.fbx',object=>{
 try{
  object.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(object);
  if(!Number.isFinite(bounds.min.x)||bounds.isEmpty())throw new Error('FBX has no visible mesh geometry');
  const size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);if(!Number.isFinite(maxDim)||maxDim<=0)throw new Error('Invalid FBX model dimensions');
  object.position.sub(center);object.scale.setScalar(3.25/maxDim);object.updateMatrixWorld(true);
  // Keep the FBX's original mesh materials and skinning; render the actual model, not a generated point-cloud approximation.
  object.traverse(child=>{if(child.isMesh){child.frustumCulled=false;if(child.material){const mats=Array.isArray(child.material)?child.material:[child.material];mats.forEach(m=>{if(m){m.side=THREE.DoubleSide;m.needsUpdate=true;}});}}});
  modelRoot.add(object);model=object;
  const fittedBounds=new THREE.Box3().setFromObject(modelRoot), fittedSize=fittedBounds.getSize(new THREE.Vector3());
  const verticalCenter=(fittedBounds.min.y+fittedBounds.max.y)/2;
  modelRoot.position.y=-verticalCenter;
  const fov=THREE.MathUtils.degToRad(camera.fov);let distance=(Math.max(fittedSize.y,fittedSize.x)/2)/Math.tan(fov/2)*1.35;
  distance=Math.max(4.4,Math.min(distance,12));camera.position.set(0,0.05,distance);camera.lookAt(0,0,0);camera.near=0.01;camera.far=Math.max(100,distance*10);camera.updateProjectionMatrix();
  progress(1);setTimeout(finish,350);
 }catch(e){showError(e);}
},xhr=>{if(xhr.lengthComputable&&xhr.total>0)progress(xhr.loaded/xhr.total);else{labelEl.textContent='Downloading character model…';}},err=>showError(err));
let last=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;
 if(model){targetYaw=pointer.active?pointer.x*.25:Math.sin(t*.00025)*.035;targetPitch=pointer.active?-pointer.y*.08:0;currentYaw+=(targetYaw-currentYaw)*Math.min(1,dt*3);currentPitch+=(targetPitch-currentPitch)*Math.min(1,dt*3);modelRoot.rotation.y=currentYaw;modelRoot.rotation.x=currentPitch;cursorLight.position.set(pointer.x*2.2,pointer.y*-1.5,2.2);cursorLight.intensity+=(pointer.active?2.2:0-cursorLight.intensity)*Math.min(1,dt*3);}
 renderer.render(scene,camera);
}requestAnimationFrame(animate);
})();
</script>
</body></html>
