<style>

*{box-sizing:border-box}

.hero.on{opacity:1}

.sub{margin:.6em 0 0;color:var(--muted);font-size:clamp(13px,1.2vw,16px)}
.loader{position:fixed;inset:0;display:grid;place-items:center;transition:opacity 1s ease}
.loader.done{opacity:0;pointer-events:none}
.ringbox{position:relative;width:150px;height:150px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:1.5}
.ringbox .track{stroke:rgba(233,230,218,.12)}
.ringbox .fill{stroke:var(--sage);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
</style>

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x0d100d,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0,0.1,5.2);camera.lookAt(0,0,0);
const U={uTime:{value:0},uYaw:{value:0},uPitch:{value:0},uCursor:{value:new THREE.Vector2(0,0)},uCursorStrength:{value:0},uSweep:{value:99},uMouth:{value:0},uIdle:{value:0},uSize:{value:0.024},uPixel:{value:800}};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  U.uPixel.value=renderer.getPixelRatio()*innerHeight/(2*Math.tan(THREE.MathUtils.degToRad(15)));}
addEventListener('resize',resize);resize();
const cursor={x:0,y:0,active:false};
addEventListener('pointermove',e=>{cursor.x=(e.clientX/innerWidth)*2-1;cursor.y=-((e.clientY/innerHeight)*2-1);cursor.active=true;});
addEventListener('pointerleave',()=>{cursor.active=false;});
const VERT=`
uniform float uTime,uYaw,uPitch,uSweep,uSize,uPixel,uCursorStrength,uMouth,uIdle;uniform vec2 uCursor;
attribute vec3 aStart,aColor;attribute float aDelay;
varying float vLight,vAlpha;varying vec3 vColor;
void main(){
  float p=clamp((uTime-aDelay)/1.8,0.0,1.0);float e=1.0-pow(1.0-p,3.0);
  vec3 pos=mix(aStart,position,e);pos.z+=sin(p*3.14159)*0.25;
  float mouth=exp(-pow(position.x/0.14,2.0))*exp(-pow((position.y-0.2)/0.075,2.0));
  float open=(uMouth+uIdle)*mouth*smoothstep(0.24,0.14,position.y);
  pos.y-=open*0.06;pos.z+=open*0.02;
  pos.y+=sin(uTime*1.3+position.x*3.0)*0.006;
  float cy=cos(uYaw),sy=sin(uYaw),cx=cos(uPitch),sx=sin(uPitch);
  vec3 r=vec3(pos.x*cy+pos.z*sy,pos.y,-pos.x*sy+pos.z*cy);
  r=vec3(r.x,r.y*cx-r.z*sx,r.y*sx+r.z*cx);
  vec4 mv=modelViewMatrix*vec4(r,1.0);gl_Position=projectionMatrix*mv;
  float d=distance(r.xy,uCursor);float glow=exp(-d*d*12.0)*uCursorStrength;
  float band=exp(-pow((r.x*0.7+r.y*0.9)-uSweep,2.0)*18.0);
  vLight=0.85+glow*0.9+band*0.9;vColor=aColor;vAlpha=e;
  gl_PointSize=uSize*uPixel/-mv.z*(0.5+0.7*e);
}`;
const FRAG=`varying float vLight,vAlpha;varying vec3 vColor;
void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;
  float a=smoothstep(0.5,0.0,d)*vAlpha;gl_FragColor=vec4(vColor*vLight,a*0.9);}`;
function setProgress(p){document.getElementById('ring').style.strokeDashoffset=427.3*(1-p);document.getElementById('count').textContent=Math.round(p*100);}
const R=Math.random;
let assembleAt=0,started=false;
async function build(){
  const N=P.length;const target=new Float32Array(N*3),col=new Float32Array(N*3),start=new Float32Array(N*3),delay=new Float32Array(N);
  for(let i=0;i<N;i++){
    const q=P[i];target.set([q[0],q[1],q[2]],i*3);
    const b=q[3];col.set([0.55+0.45*b,0.36+0.5*b,0.26+0.36*b],i*3);
    const a=R()*Math.PI*2;start.set([Math.cos(a)*3.2,Math.sin(a)*3.2*0.85+0.1,-1.2+R()*0.4],i*3);
    delay[i]=0.1+R()*0.9;
    if(i%500===0){setProgress(i/N);await new Promise(r=>setTimeout(r,0));}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(target,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aStart',new THREE.BufferAttribute(start,3));
  g.setAttribute('aDelay',new THREE.BufferAttribute(delay,1));
  const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:VERT,fragmentShader:FRAG,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(g,mat);pts.frustumCulled=false;scene.add(pts);
  const DN=500,dpos=new Float32Array(DN*3),dS=new Float32Array(DN);
  for(let i=0;i<DN;i++){dpos.set([(R()*2-1)*3,R()*5,(R()*2-1)*2],i*3);dS[i]=R();}
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.BufferAttribute(dpos,3));
  dg.setAttribute('aS',new THREE.BufferAttribute(dS,1));
  const dmat=new THREE.ShaderMaterial({uniforms:{uTime:U.uTime,uPixel:U.uPixel},
    vertexShader:`uniform float uTime,uPixel;attribute float aS;
      void main(){vec3 p=position;p.y=mod(p.y+uTime*0.03*(0.5+aS),5.0)-2.5;
      vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;
      gl_PointSize=(1.2+aS*1.8)*0.012*uPixel/-mv.z;}`,
    fragmentShader:`void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;gl_FragColor=vec4(0.8,0.75,0.6,(0.5-d)*0.4);}`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const dust=new THREE.Points(dg,dmat);dust.frustumCulled=false;scene.add(dust);
}
const mouse={x:0,y:0};
let mouthTarget=0;
addEventListener('message',e=>{if(e.data&&e.data.type==='elisa-level'){mouthTarget=Math.min(1,Math.max(0,Number(e.data.level)||0)*2.2);}});
function loop(now){
  if(started){
    const ta=(now-assembleAt)/1000;U.uTime.value=Math.max(0,ta);
    const st=ta-3.0;U.uSweep.value=(st>0&&st<2.2)?(-2.5+st/2.2*5):99;
    const tx=cursor.active?cursor.x:0,ty=cursor.active?cursor.y:0;
    mouse.x+=(tx-mouse.x)*0.04;mouse.y+=(ty-mouse.y)*0.04;
    U.uYaw.value=mouse.x*0.3+Math.sin(ta*0.5)*0.08;U.uPitch.value=-mouse.y*0.08+Math.sin(ta*0.37)*0.03;
    U.uMouth.value+=(mouthTarget-U.uMouth.value)*0.35;
    U.uIdle.value=(Math.sin(ta*9.0)*0.5+0.5)*0.12*Math.min(1,mouthTarget*4.0+0.0);
    U.uCursor.value.set(mouse.x*1.0,mouse.y*1.0);
    U.uCursorStrength.value+=((cursor.active?1:0)-U.uCursorStrength.value)*0.05;
  }
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
build().then(()=>{setProgress(1);setTimeout(()=>{document.getElementById('loader').classList.add('done');document.getElementById('hero').classList.add('on');},300);assembleAt=performance.now();started=true;});
})();
